version: 2.1

# DRY continued config, held centrally. It declares the pipeline parameters
# (and their defaults) and the workflow that working repos share. Parameter
# *values* are injected from the working repo at runtime by the setup config.
#
# Two jobs run:
#   - central-orb/orb-job : a standard job from the shared URL orb (not overridable)
#   - second-job          : a standard job the working repo CAN override, via
#                           `override-with`. If the working repo's override orb
#                           defines `second-job`, that definition replaces the
#                           central default below; otherwise the default is used.

parameters:
  test:
    type: string
    default: "pass me"
  # Value passed into the (possibly overridden) second job. Set from the working repo.
  second_message:
    type: string
    default: "central default for second-job"
  # URL orb that MAY override `second-job`. The setup job sets this per-repo: to
  # the working repo's ci/app.yml when that file defines jobs, otherwise to the
  # shared orb below (which has no `second-job`). So the DEFAULT is "no override"
  # -- override-with falls back to the central base job.
  override_orb_url:
    type: string
    default: "https://raw.githubusercontent.com/felixshiftellecon/central-config-circleci/continuation/orbs/orb.yml"
  # Name of the job (in the override orb) that replaces `second-job`. The consumer
  # sets this to whatever they named their override job; it defaults to
  # "second-job". If the override orb has no job by this name, override-with
  # falls back to the central base job below.
  override_job:
    type: string
    default: "second-job"
  # Git ref (branch, tag, or SHA) of the central repo that the shared URL orb is
  # resolved from. Pinned to a SHA so the orb is immutable per run. To emergency
  # deploy an orb change to every consumer at once, bump an orb sha and change
  # this default in one commit on the continuation branch.
  central_orb_ref:
    type: string
    default: "12e40f0018a36321780e73eec922b1624bff5dda"

orbs:
  central-orb: https://raw.githubusercontent.com/felixshiftellecon/central-config-circleci/<< pipeline.parameters.central_orb_ref >>/orbs/orb.yml
  override-orb: << pipeline.parameters.override_orb_url >>

jobs:
  # Central default (fallback) for the overridable second job. Used only if the
  # override orb does not define `second-job`.
  second-job:
    docker:
      - image: cimg/base:stable
    resource_class: small
    parameters:
      job_param_2:
        type: string
        default: "base default"
    steps:
      - run: 'echo "BASE (central) second-job: << parameters.job_param_2 >>"'

workflows:
  test-workflow:
    jobs:
      - central-orb/orb-job:
          job_param_1: << pipeline.parameters.test >>
      - second-job:
          # Display the resolved job name in the UI so an override is visibly
          # distinct from the central base job (which shows as "second-job").
          name: << pipeline.parameters.override_job >>
          override-with: override-orb/<< pipeline.parameters.override_job >>
          job_param_2: << pipeline.parameters.second_message >>
