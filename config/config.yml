version: 2.1
setup: true

# Central setup config -- the config source shared by EVERY working repo (via the
# GitHub App). It runs the same for all of them and derives per-repo behaviour:
#
#   1. checkout                -> checks out the triggering working repo
#   2. read ci/app.yml IF present:
#        - parameter values  = each parameter's default in that file
#        - override target   = this repo's ci/app.yml *only if it defines jobs*
#      otherwise (no ci/app.yml, or no jobs in it):
#        - parameter values  = {} (central defaults are used)
#        - override target   = the shared orb (which has no second-job), so
#                              override-with falls back to the central base job.
#      => DEFAULT MODE IS "NO OVERRIDE". A repo opts in by adding ci/app.yml.
#   3. materialize the embedded DRY continued config (base64; no HTTP fetch, so
#      this works for private repos too)
#   4. continue into it, injecting the derived parameters.
#
# The base64 blob is the canonical config/continued.yml. To change the workflow,
# edit config/continued.yml and regenerate:
#     base64 < config/continued.yml | tr -d '\n'

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  build-parameters:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install yq
          command: |
            curl -sSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /tmp/yq
            chmod +x /tmp/yq
      - run:
          name: Derive pipeline parameters and override target from this repo
          command: |
            # Default mode: no per-repo file -> central defaults, no override.
            PARAMS='{}'
            OVERRIDE_URL="https://raw.githubusercontent.com/felixshiftellecon/central-config-circleci/continuation/orbs/orb.yml"
            if [ -f ci/app.yml ]; then
              # Parameter VALUES = each parameter's default declared in ci/app.yml.
              PARAMS=$(/tmp/yq -o=json '(.parameters // {}) | with_entries(.value = .value.default)' ci/app.yml)
              # Only treat this repo as an override if its ci/app.yml defines jobs.
              if /tmp/yq -e '.jobs' ci/app.yml >/dev/null 2>&1; then
                OVERRIDE_URL="https://raw.githubusercontent.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}/ci/app.yml"
              fi
            fi
            export OVERRIDE_URL
            echo "$PARAMS" | /tmp/yq -o=json '. + {"override_orb_url": strenv(OVERRIDE_URL)}' > /tmp/pipeline-parameters.json
            echo "Resolved pipeline parameters:"; cat /tmp/pipeline-parameters.json
      - run:
          name: Materialize the DRY continued config (embedded; no HTTP fetch)
          command: |
            echo "" | base64 -d > /tmp/continued.yml
            cat /tmp/continued.yml
      - continuation/continue:
          configuration_path: /tmp/continued.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - build-parameters
