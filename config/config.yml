version: 2.1
setup: true

# Central setup config -- the config source for the working repo's pipeline
# (via the GitHub App). It:
#   1. checks out the working repo (the checkout source),
#   2. reads that repo's single customization file (ci/app.yml) for parameter
#      values,
#   3. materializes the DRY continued config that is embedded below, and
#   4. continues into it, injecting the parameter values.
#
# The continued config is EMBEDDED here (base64) rather than fetched over HTTP.
# CircleCI already fetches this setup config from the central repo through the
# authenticated GitHub App integration, so embedding keeps the whole flow working
# for PRIVATE repos too -- there is no raw/unauthenticated download of config.
#
# The base64 blob is the canonical config/continued.yml. To change the workflow,
# edit config/continued.yml and regenerate:
#     base64 < config/continued.yml | tr -d '\n'

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  build-parameters:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install yq
          command: |
            curl -sSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /tmp/yq
            chmod +x /tmp/yq
      - run:
          name: Read pipeline parameter values from the working repo (ci/app.yml)
          command: |
            /tmp/yq -o=json '.parameters | with_entries(.value = .value.default)' ci/app.yml | tee /tmp/pipeline-parameters.json
      - run:
          name: Materialize the DRY continued config (embedded; no HTTP fetch)
          command: |
            echo "" | base64 -d > /tmp/continued.yml
            cat /tmp/continued.yml
      - continuation/continue:
          configuration_path: /tmp/continued.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - build-parameters
