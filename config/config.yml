version: 2.1
setup: true

# Central setup config -- the config source shared by EVERY working repo (via the
# GitHub App). It runs the same for all of them and derives per-repo behaviour:
#
#   1. checkout                -> checks out the triggering working repo
#   2. read ci/app.yml IF present:
#        - parameter values  = each parameter's default in that file
#        - override target   = this repo's ci/app.yml *only if it defines jobs*
#      otherwise (no ci/app.yml, or no jobs in it):
#        - parameter values  = {} (central defaults are used)
#        - override target   = the shared orb (no second-job) -> base job runs.
#      => DEFAULT MODE IS "NO OVERRIDE". A repo opts in by adding ci/app.yml.
#   3. fetch the DRY continued config from the (private) central repo using the
#      reusable `github-app-fetch` command below (short-lived installation token,
#      no PAT, works for private repos). Credentials come from the
#      `central-config-reader` context.
#   4. continue into it, injecting the derived parameters.

orbs:
  continuation: circleci/continuation@1.0.0

# ---------------------------------------------------------------------------
# Reusable command. This is written to be lifted verbatim into a URL/registry
# orb later: it is self-contained and fully parameterized (no hard-coded repo,
# path, ref, or env var names). Callers supply the App credentials via a context.
# ---------------------------------------------------------------------------
commands:
  github-app-fetch:
    description: >
      Fetch a single file from a (possibly private) GitHub repo using a GitHub
      App installation token. Signs a JWT with the App private key, exchanges it
      for a short-lived installation token, then downloads the file. Requires
      openssl and curl (present on cimg/base).
    parameters:
      repo:
        type: string
        description: "Source repo, as owner/name."
      path:
        type: string
        description: "File path within the repo."
      ref:
        type: string
        default: "main"
        description: "Git ref (branch, tag, or SHA) to read from."
      output:
        type: string
        default: "/tmp/fetched"
        description: "Local path to write the fetched file to."
      app_id_var:
        type: env_var_name
        default: GH_APP_ID
        description: "Env var holding the GitHub App ID."
      installation_id_var:
        type: env_var_name
        default: GH_APP_INSTALLATION_ID
        description: "Env var holding the installation ID."
      private_key_var:
        type: env_var_name
        default: GH_APP_PRIVATE_KEY
        description: "Env var holding the App private key (PEM)."
    steps:
      - run:
          name: "Fetch << parameters.repo >> / << parameters.path >> via GitHub App"
          command: |
            set -e
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            now=$(date +%s)
            header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
            payload=$(printf '%s' "{\"iat\":$((now-60)),\"exp\":$((now+540)),\"iss\":\"${<< parameters.app_id_var >>}\"}" | b64url)
            # Sign with the App private key via process substitution (key never on disk).
            sig=$(printf '%s' "$header.$payload" \
              | openssl dgst -sha256 -sign <(printf '%s' "${<< parameters.private_key_var >>}") -binary \
              | b64url)
            JWT="$header.$payload.$sig"
            # App JWT -> short-lived installation token.
            TOKEN=$(curl -fsS -X POST \
              -H "Authorization: Bearer $JWT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations/${<< parameters.installation_id_var >>}/access_tokens" \
              | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            # Download the file with the installation token.
            curl -fsSL \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/<< parameters.repo >>/contents/<< parameters.path >>?ref=<< parameters.ref >>" \
              -o "<< parameters.output >>"

jobs:
  build-parameters:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install yq
          command: |
            curl -sSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /tmp/yq
            chmod +x /tmp/yq
      - github-app-fetch:
          repo: felixshiftellecon/central-config-circleci
          path: config/continued.yml
          ref: continuation
          output: /tmp/continued.yml
      - run:
          name: Derive pipeline parameters and inline the override orb URL
          command: |
            # Default mode: no per-repo file -> central defaults, no override.
            PARAMS='{}'
            OVERRIDE_URL="https://raw.githubusercontent.com/felixshiftellecon/central-config-circleci/continuation/orbs/orb.yml"
            if [ -f ci/app.yml ]; then
              PARAMS=$(/tmp/yq -o=json '(.parameters // {}) | with_entries(.value = .value.default)' ci/app.yml)
              if /tmp/yq -e '.jobs' ci/app.yml >/dev/null 2>&1; then
                OVERRIDE_URL="https://raw.githubusercontent.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}/ci/app.yml"
              fi
            fi
            export OVERRIDE_URL
            # Write the resolved override URL straight into the continued config so it
            # shows up as a concrete orb URL. Config policies read orb refs before
            # pipeline parameters are substituted, so a pipeline-parameter placeholder
            # would be invisible to them. Inlining here is what lets the org policy
            # govern which repos may point the override orb at themselves.
            # (Note: do not write the pipeline-parameter template syntax in this file,
            # even in a comment, or CircleCI tries to interpolate it and the setup
            # config fails to compile.)
            /tmp/yq -i '.orbs["override-orb"] = strenv(OVERRIDE_URL)' /tmp/continued.yml
            echo "$PARAMS" | /tmp/yq -o=json '. + {"override_orb_url": strenv(OVERRIDE_URL)}' > /tmp/pipeline-parameters.json
            echo "Resolved pipeline parameters:"; cat /tmp/pipeline-parameters.json
      - run:
          name: Show continued config to be continued
          command: cat /tmp/continued.yml
      - continuation/continue:
          configuration_path: /tmp/continued.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  setup:
    jobs:
      - build-parameters:
          context: central-config-reader
