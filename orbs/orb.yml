version: 2.1

jobs:
  orb-job:
    docker:
      - image: cimg/base:stable
    resource_class: small
    parameters:
      job_param_1:
        type: string
        default: "don't show me"
      # Orb version marker. This default is the only thing that differs between
      # orb shas, so bumping it and re-pinning central_orb_ref is what proves an
      # emergency orb deploy from the central repo. Callers do not pass this, so
      # whichever sha central_orb_ref points at supplies the value.
      version:
        type: string
        default: "2"
    steps:
      - run: echo "central-orb orb-job [orb version << parameters.version >>] job_param_1=<< parameters.job_param_1 >>"
